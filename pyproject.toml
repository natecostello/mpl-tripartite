[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "mpl-tripartite"
dynamic = ["version"]
description = "Custom matplotlib projection for tripartite (four-coordinate) log-log plots"
requires-python = ">=3.9"
authors = [{ name = "Nate Costello" }]
readme = "README.md"
license = "MIT"
keywords = ["tripartite", "matplotlib", "projection", "shock", "srs", "seismic", "vibration", "nomograph"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Visualization",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "matplotlib>=3.6",
  "numpy>=1.21",
]

[project.urls]
Homepage = "https://github.com/natecostello/mpl-tripartite"
Repository = "https://github.com/natecostello/mpl-tripartite"
Issues = "https://github.com/natecostello/mpl-tripartite/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.1.0"

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "black>=22.0", "mypy>=0.900"]
